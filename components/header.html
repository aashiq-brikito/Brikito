
<header class="global-header">
  <div class="global-header-inner">

    <!-- Brikito Logo (black icon + Brikito text) -->
    <a
      class="global-logo"
      href="/"
      aria-label="Brikito home"
      style="display:inline-flex;align-items:center;gap:9px;color:#0a0a0a;text-decoration:none"
    >
      <svg
        class="global-logo-mark"
        viewBox="0 0 4096 4096"
        width="24"
        height="24"
        fill="currentColor"
        aria-hidden="true"
        focusable="false"
        style="display:block;flex:none"
      >
        <path d="M1024 1024V100A100 100 0 0 1 1124 0H3996A100 100 0 0 1 4096 100V2972A100 100 0 0 1 3996 3072H3172A100 100 0 0 1 3072 2972V1124A100 100 0 0 0 2972 1024Z"/>
        <path d="M1024 1024V100A100 100 0 0 1 1124 0H3996A100 100 0 0 1 4096 100V2972A100 100 0 0 1 3996 3072H3172A100 100 0 0 1 3072 2972V1124A100 100 0 0 0 2972 1024Z" transform="rotate(180 2048 2048)"/>
      </svg>
      <span class="global-logo-text">Brikito</span>
    </a>

    <!-- Mobile Menu Button -->
    <button
      class="global-menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="global-nav"
      aria-label="Open menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Main Navigation -->
    <nav
      class="global-nav"
      id="global-nav"
      aria-label="Primary navigation"
    >

      <!-- Features dropdown -->
      <div class="global-dd">
        <button class="global-dd-btn" type="button" aria-expanded="false" aria-controls="global-features">
          Features
          <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="global-dd-menu" id="global-features">
          <a href="/brik-ai">
            <span class="global-dd-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span>
            <span class="global-dd-tx"><b>Brik AI</b><small>The AI assistant built for construction</small></span>
          </a>
          <a href="/brikchat">
            <span class="global-dd-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg></span>
            <span class="global-dd-tx"><b>BrikChat</b><small>Site chat that turns messages into work</small></span>
          </a>
          <a href="/brikvision">
            <span class="global-dd-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span>
            <span class="global-dd-tx"><b>BrikVision</b><small>AI on your site CCTV, 24/7</small></span>
          </a>
          <a href="/brikdocs">
            <span class="global-dd-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg></span>
            <span class="global-dd-tx"><b>BrikDocs</b><small>DPR, BOQ, BBS and more in one tap</small></span>
          </a>
        </div>
      </div>

      <a href="/blog">Resources</a>
      <a href="/pricing">Pricing</a>
    </nav>

    <!-- Header Buttons -->
    <div class="global-header-actions">

      <a
        class="global-trial"
        href="https://app.brikito.com/signup"
      >
        Sign in
      </a>

      <a
        class="global-demo"
        href="/book-a-demo"
      >
        Book a demo <span aria-hidden="true">↗</span>
      </a>

    </div>

  </div>
</header>
